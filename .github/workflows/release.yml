name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and package DMGs
        run: |
          for arch in arm64 x86_64; do
            rm -rf build/OfxRawHost.app build/dmg
            ARCHS=$arch VERSION="${GITHUB_REF_NAME#v}" ./build.sh
            mkdir build/dmg && cp -R build/OfxRawHost.app build/dmg/ && ln -s /Applications build/dmg/Applications
            hdiutil create -volname "OFX Raw Host" -srcfolder build/dmg -format UDZO -ov "build/OfxRawHost-macOS-$arch.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-macOS
          path: build/OfxRawHost-macOS-*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" build/OfxRawHost-macOS-*.dmg --clobber
