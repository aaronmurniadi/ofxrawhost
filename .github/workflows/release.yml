name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 (Apple Silicon)
          - os: macos-14
            arch: arm64
          # x86_64 (Intel) — macos-13 is retired; use macos-15-intel
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew install cmake libraw libtiff little-cms2 webp jpeg-xl
      - name: Build and package DMG
        run: |
          rm -rf build
          ARCHS=${{ matrix.arch }} VERSION="${GITHUB_REF_NAME#v}" ./build.sh
          # Verify binary arch matches the matrix target
          lipo -info build/OfxRawHost.app/Contents/MacOS/OfxRawHost | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          mkdir -p build/dmg
          cp -R build/OfxRawHost.app build/dmg/
          ln -sf /Applications build/dmg/Applications
          hdiutil create -volname "OFX Raw Host" -srcfolder build/dmg -format UDZO -ov \
            "build/OfxRawHost-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-macOS-${{ matrix.arch }}
          path: build/OfxRawHost-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file wget xvfb \
            libraw-dev libtiff-dev liblcms2-dev libwebp-dev zlib1g-dev libpng-dev \
            libgl1-mesa-dev libgl1-mesa-dri xorg-dev
      # Ubuntu 22.04 has no libjxl package (JPEG XL arrives in 24.04), so build
      # it here and keep the older glibc baseline of this runner.
      - name: Build JPEG XL
        run: |
          git clone --depth 1 --branch v0.11.1 --recurse-submodules --shallow-submodules \
            https://github.com/libjxl/libjxl.git /tmp/libjxl
          cmake -S /tmp/libjxl -B /tmp/libjxl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_FUZZERS=OFF \
            -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_PLUGINS=OFF \
            -DJPEGXL_ENABLE_SKCMS=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF \
            -DJPEGXL_ENABLE_VIEWERS=OFF \
            -DJPEGXL_FORCE_SYSTEM_HWY=OFF \
            -DJPEGXL_FORCE_SYSTEM_BROTLI=OFF
          cmake --build /tmp/libjxl-build --parallel "$(nproc)"
          sudo cmake --install /tmp/libjxl-build
          sudo ldconfig
          pkg-config --modversion libjxl libjxl_threads
      - name: Configure and build
        run: |
          # The AppImage targets X11; GLFW would otherwise enable Wayland when
          # the runner image happens to ship libwayland-dev without wayland-scanner.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build --parallel "$(nproc)"
      - name: Self-test
        run: |
          # Runs under a virtual display; a runner without GPU acceleration may
          # lack OpenGL 3.2, which is a runner limit and not a build failure.
          if xvfb-run -a ./build/OfxRawHost --selftest; then
            echo "selftest passed"
          else
            echo "::warning::selftest did not pass on the runner; continuing"
          fi
      - name: Build AppImage
        run: |
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION=0.0.0; fi
          VERSION="$VERSION" APPIMAGETOOL=/tmp/appimagetool packaging/linux/build-appimage.sh
          test -x build/AppImage/OfxRawHost-Linux-x86_64.AppImage
          ldd build/AppImage/OfxRawHost.AppDir/usr/bin/OfxRawHost || true
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-Linux-x86_64
          path: build/AppImage/OfxRawHost-Linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Export the GitHub Actions cache for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure and build
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_APPLOCAL_DEPS=ON
          cmake --build build --config Release --parallel
      - name: Self-test
        continue-on-error: true
        run: |
          ./build/Release/OfxRawHost.exe --selftest
      - name: Package zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'build/dist/OfxRawHost-Windows-x64'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/Release/OfxRawHost.exe $dist
          # The host loads the icon font beside the executable and finds the
          # bundled OFX plugin bundle in <exe dir>/Plugins.
          Copy-Item build/Release/fa-solid-900.ttf $dist
          Copy-Item -Recurse build/Plugins $dist/Plugins
          Copy-Item README.md, LICENSE $dist
          # vcpkg app-local deployment copies the dependency DLLs; add the MSVC
          # runtime so the zip runs on a machine without the VC++ redistributable.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            $crt = Get-ChildItem -Path "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue |
              Select-Object -Last 1
            if ($crt) { Copy-Item "$($crt.FullName)\*.dll" $dist -Force }
          }
          if (-not (Test-Path "$dist\vcruntime140.dll")) {
            Write-Host '::warning::MSVC runtime DLLs were not found; the zip needs the VC++ redistributable'
          }
          Get-ChildItem $dist -Recurse | Select-Object -ExpandProperty Name
          Compress-Archive -Path "$dist/*" -DestinationPath 'build/OfxRawHost-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-Windows-x64
          path: build/OfxRawHost-Windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PREV=$(git tag --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')
          NOTES=$(mktemp)
          {
            if [ -f "docs/releases/${TAG}.md" ]; then
              cat "docs/releases/${TAG}.md"
              echo
            fi
            echo "## Downloads"
            echo
            echo "- **macOS (Apple Silicon):** \`OfxRawHost-macOS-arm64.dmg\`"
            echo "- **macOS (Intel):** \`OfxRawHost-macOS-x86_64.dmg\`"
            echo "- **Windows (x64):** \`OfxRawHost-Windows-x64.zip\`"
            echo "- **Linux (x86_64):** \`OfxRawHost-Linux-x86_64.AppImage\`"
            echo
            if [ -n "${PREV:-}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            fi
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.zip dist/*.AppImage --clobber
