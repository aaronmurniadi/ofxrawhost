name: Release

on:
  push:
    tags: ['v*']
    # A push to release/vX.X.X publishes the build as vX.X.X-dev. The merge of
    # that branch into main, tagged vX.X.X, publishes the same build as stable.
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job decides the version, the release tag, and the pre-release flag, so
  # every build job stamps the same numbers and the publish job names one tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="0.0.0"
          tag=""
          prerelease="false"
          is_release="false"
          if [ "$REF_TYPE" = "tag" ]; then
            # The tag vX.X.X carries the version X.X.X.
            version="${REF_NAME#v}"
            tag="$REF_NAME"
            is_release="true"
          elif [[ "$REF_NAME" == release/v* ]]; then
            # The branch release/vX.X.X carries the version X.X.X and the tag
            # vX.X.X-dev. The build keeps the numeric version, because the
            # Windows file version and the macOS bundle version accept digits
            # and dots only.
            version="${REF_NAME#release/v}"
            tag="v${version}-dev"
            prerelease="true"
            is_release="true"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag prerelease=$prerelease is_release=$is_release"

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 (Apple Silicon)
          - os: macos-14
            arch: arm64
          # x86_64 (Intel) — macos-13 is retired; use macos-15-intel
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: brew install cmake libraw libtiff little-cms2 webp jpeg-xl
      - name: Build and package DMG
        run: |
          rm -rf build
          ARCHS=${{ matrix.arch }} VERSION="${{ needs.prepare.outputs.version }}" ./build.sh
          # Verify binary arch matches the matrix target
          lipo -info build/OfxRawHost.app/Contents/MacOS/OfxRawHost | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          mkdir -p build/dmg
          cp -R build/OfxRawHost.app build/dmg/
          ln -sf /Applications build/dmg/Applications
          hdiutil create -volname "OFX Raw Host" -srcfolder build/dmg -format UDZO -ov \
            "build/OfxRawHost-macOS-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-macOS-${{ matrix.arch }}
          path: build/OfxRawHost-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git file wget xvfb \
            libraw-dev libtiff-dev liblcms2-dev libwebp-dev zlib1g-dev libpng-dev \
            libgl1-mesa-dev libgl1-mesa-dri xorg-dev
      # Ubuntu 22.04 has no libjxl package (JPEG XL arrives in 24.04), so build
      # it here and keep the older glibc baseline of this runner.
      - name: Build JPEG XL
        run: |
          git clone --depth 1 --branch v0.11.1 --recurse-submodules --shallow-submodules \
            https://github.com/libjxl/libjxl.git /tmp/libjxl
          cmake -S /tmp/libjxl -B /tmp/libjxl-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF \
            -DJPEGXL_ENABLE_BENCHMARK=OFF \
            -DJPEGXL_ENABLE_DEVTOOLS=OFF \
            -DJPEGXL_ENABLE_DOXYGEN=OFF \
            -DJPEGXL_ENABLE_EXAMPLES=OFF \
            -DJPEGXL_ENABLE_FUZZERS=OFF \
            -DJPEGXL_ENABLE_JNI=OFF \
            -DJPEGXL_ENABLE_MANPAGES=OFF \
            -DJPEGXL_ENABLE_PLUGINS=OFF \
            -DJPEGXL_ENABLE_SKCMS=OFF \
            -DJPEGXL_ENABLE_TOOLS=OFF \
            -DJPEGXL_ENABLE_VIEWERS=OFF \
            -DJPEGXL_FORCE_SYSTEM_HWY=OFF \
            -DJPEGXL_FORCE_SYSTEM_BROTLI=OFF
          cmake --build /tmp/libjxl-build --parallel "$(nproc)"
          sudo cmake --install /tmp/libjxl-build
          sudo ldconfig
          pkg-config --modversion libjxl libjxl_threads
      - name: Configure and build
        run: |
          # The AppImage targets X11; GLFW would otherwise enable Wayland when
          # the runner image happens to ship libwayland-dev without wayland-scanner.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLFW_BUILD_WAYLAND=OFF
          cmake --build build --parallel "$(nproc)"
      - name: Self-test
        run: |
          # Runs under a virtual display; a runner without GPU acceleration may
          # lack OpenGL 3.2, which is a runner limit and not a build failure.
          if xvfb-run -a ./build/OfxRawHost --selftest; then
            echo "selftest passed"
          else
            echo "::warning::selftest did not pass on the runner; continuing"
          fi
      - name: Build AppImage
        run: |
          wget -q -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          VERSION="${{ needs.prepare.outputs.version }}" APPIMAGETOOL=/tmp/appimagetool packaging/linux/build-appimage.sh
          test -x build/AppImage/OfxRawHost-Linux-x86_64.AppImage
      - name: Smoke-test the AppImage
        run: |
          set -e
          APP=build/AppImage/OfxRawHost-Linux-x86_64.AppImage
          # The icon font must sit next to the binary for the shipped build to
          # resolve it outside the build tree.
          test -f build/AppImage/OfxRawHost.AppDir/usr/bin/fa-solid-900.ttf
          OUT=$(APPIMAGE_EXTRACT_AND_RUN=1 "$APP" --selftest 2>&1)
          printf '%s\n' "$OUT" | tail -3
          printf '%s\n' "$OUT" | grep -q "ok  Transform"
          # Start the interface and stop it again: this loads the bundled
          # libraries, opens a GL context, and reports a missing icon font.
          # Exit code 124 means the timeout stopped a running application.
          set +e
          RUN=$(APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a "$APP" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$RUN" | tail -3
          if [ "$RC" != 124 ]; then
            echo "::error::the interface exited with code $RC instead of running"
            exit 1
          fi
          if printf '%s\n' "$RUN" | grep -q "could not load Font Awesome"; then
            echo "::error::the AppImage cannot load the icon font"
            exit 1
          fi
          # The legacy path covers a machine without an OpenGL 3.3 driver, such as
          # a virtual machine or a remote desktop session.
          set +e
          LEGACY=$(OFX_HOST_LEGACY_GL=1 APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a "$APP" 2>&1)
          LEGACY_RC=$?
          set -e
          printf '%s\n' "$LEGACY" | tail -3
          if [ "$LEGACY_RC" != 124 ]; then
            echo "::error::the legacy OpenGL path exited with code $LEGACY_RC instead of running"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-Linux-x86_64
          path: build/AppImage/OfxRawHost-Linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-2022
    env:
      # The static triplet links every dependency and the C runtime into the
      # executable, so the release is one file with no DLLs beside it.
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      # vcpkg dropped its x-gha backend, so cache the built packages as files and
      # let actions/cache store the directory.
      VCPKG_BINARY_SOURCES: clear;files,C:/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          # Key on the run, not on the manifest, so a version bump does not throw
          # away every built package. vcpkg looks packages up by an ABI hash, so
          # an entry that no longer matches is simply rebuilt and added.
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ github.run_id }}
          restore-keys: vcpkg-${{ runner.os }}-x64-windows-static-
      - name: Install vcpkg
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.prepare.outputs.version }}'
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_OVERLAY_TRIPLETS=packaging/vcpkg-triplets `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            "-DOFX_VERSION=$version"
          if ($LASTEXITCODE -ne 0) { throw 'cmake configure failed' }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'the build failed' }
      - name: Package the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/OfxRawHost-Windows-x64.exe'
          Copy-Item build/Release/OfxRawHost.exe $exe
          Get-Item $exe | Select-Object Name, Length
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'build/OfxRawHost-Windows-x64.exe'
          # One file: the icon font and the Transform effect must live inside it,
          # the C runtime must not be a DLL the user has to install, and the
          # executable must not open a console window.
          $image = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe))
          if ($image -notmatch 'Font Awesome') { throw 'the icon font is not embedded in the executable' }
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if ($dumpbin) {
            $imports = & $dumpbin.FullName /dependents $exe | Out-String
            if ($imports -match 'MSVCP140|VCRUNTIME140') { throw "the executable still imports the MSVC runtime:`n$imports" }
            $headers = & $dumpbin.FullName /headers $exe | Out-String
            $subsystem = ($headers -split "`n" | Select-String 'subsystem' | Select-Object -First 1).Line
            Write-Host "subsystem:$subsystem"
            if ($headers -notmatch 'subsystem \(Windows GUI\)') { throw 'the executable still uses the console subsystem' }
          } else {
            Write-Host '::warning::dumpbin not found; the static runtime and subsystem checks were skipped'
          }
          # Runs every plugin on a small image, so this fails when a dependency is
          # missing or the linked-in Transform effect cannot be registered.
          # Start-Process waits for the process and captures the streams, which
          # works the same for the GUI subsystem.
          $stdout = 'build/selftest.stdout.txt'
          $stderr = 'build/selftest.stderr.txt'
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $out = "$(Get-Content $stdout -Raw)$(Get-Content $stderr -Raw)"
          Write-Host $out
          if ($proc.ExitCode -ne 0) { throw "selftest exited with $($proc.ExitCode)" }
          if ($out -notmatch 'ok  Transform') { throw 'the executable does not register the Transform effect' }
          $expected = '${{ needs.prepare.outputs.version }}'
          $actual = (Get-Item $exe).VersionInfo.FileVersion
          if ($actual -ne $expected) { throw "the file version is '$actual', expected '$expected'" }
          Write-Host "file version: $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: OfxRawHost-Windows-x64
          path: build/OfxRawHost-Windows-x64.exe
          if-no-files-found: error

  publish:
    needs: [prepare, macos, linux, windows]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          NOTES=$(mktemp)
          {
            if [ -f "docs/releases/${TAG}.md" ]; then
              cat "docs/releases/${TAG}.md"
              echo
            fi
            echo "## Downloads"
            echo
            echo "- **macOS (Apple Silicon):** \`OfxRawHost-macOS-arm64.dmg\`"
            echo "- **macOS (Intel):** \`OfxRawHost-macOS-x86_64.dmg\`"
            echo "- **Windows (x64):** \`OfxRawHost-Windows-x64.exe\`"
            echo "- **Linux (x86_64):** \`OfxRawHost-Linux-x86_64.AppImage\`"
            echo
            # A pre-release has no stable predecessor to compare against.
            if [ "$PRERELEASE" = "false" ]; then
              PREV=$(git tag --sort=-v:refname | awk -v t="$TAG" '$0 != t { print; exit }')
              if [ -n "${PREV:-}" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
              fi
            fi
          } > "$NOTES"

          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease --latest=false)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES" "${FLAGS[@]}"
          else
            # A branch push has no tag yet, so point the new tag at this commit.
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --target "$GITHUB_SHA" "${FLAGS[@]}"
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.exe dist/*.AppImage --clobber
